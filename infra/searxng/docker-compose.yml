services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: nexa-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
